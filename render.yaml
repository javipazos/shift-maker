services:
  - type: web
    name: shift-maker-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: CORS_ORIGINS
        value: "https://shift-maker-frontend-iiw1.onrender.com,http://localhost:5173,http://localhost:5174"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
    plan: free

  - type: web
    name: shift-maker-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://shift-maker-api.onrender.com/api/*
    envVars:
      - key: NODE_VERSION
        value: "20"

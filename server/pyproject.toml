[project]
name = "shift-maker-server"
version = "0.1.0"
description = "Shift scheduling backend with FastAPI and OR-Tools"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "ortools>=9.11",
    "openpyxl>=3.1.0",
    "libsql-experimental>=0.0.68",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
